{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block meta_description %}{{ meta_description }}{% endblock %}

{% block content %}
<main>
  <section class="auth-section" id="connexion">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Se connecter</h1>
        <p>Accédez à votre espace pour publier et télécharger des géodonnées vérifiées.</p>
      </div>

      <form class="auth-form" id="connexionForm" action="/connexion" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@domaine.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Votre mot de passe"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="remember" id="remember" />
            <span class="checkbox-label">Se souvenir de moi</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block transition-hover">Se connecter</button>

        <p class="auth-footer">
          Pas encore inscrit ? <a href="/inscription">Créer un compte</a>
        </p>
      </form>
    </div>
  </section>
</main>
{% endblock %}
