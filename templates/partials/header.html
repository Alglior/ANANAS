<header class="topbar">
  <div class="container topbar-inner">
    <div class="topbar-toprow">
      <a class="brand" href="/" aria-label="Accueil A.N.A.N.A.S.">
        <img
          class="brand-logo"
          src="{{ url_for('static', filename='images/logo/ANANAS.png') }}"
          alt="Logo A.N.A.N.A.S."
        />
        <span class="brand-label">
          <span class="brand-text">A.N.A.N.A.S.</span>
          <span class="brand-subtitle">Atlas Numérique d'Archives de Nœuds et d'Accès Synchronisés</span>
        </span>
      </a>

      <div class="auth-actions">
        <a class="btn btn-outline" href="/connexion">Se connecter</a>
        <a class="btn btn-outline" href="/inscription">S'inscrire</a>
      </div>
    </div>

    <div class="topbar-search-row">
      <div class="search-wrapper search-center">
        <form class="search-bar" role="search" action="#" method="get">
          <label class="sr-only" for="site-search">Rechercher sur le site</label>
          <input
            id="site-search"
            name="q"
            type="search"
            placeholder="Rechercher..."
            autocomplete="off"
          />
        </form>
      </div>
    </div>

    <nav class="nav nav-bottom" aria-label="Navigation principale">
      <a href="/">Accueil</a>
      <a href="/catalogue">Catalogue</a>
      <a href="/contact">Contact</a>
    </nav>
  </div>
