<nav class="pagination" aria-label="{{ label | default('Pagination') }}">
  {% if page > 1 %}
    <a class="btn btn-outline transition-hover pagination-prev" href="{{ base_url }}/{{ page - 1 }}">&#9664;&nbsp;Précédent</a>
  {% else %}
    <span class="btn btn-outline pagination-prev disabled">&#9664;&nbsp;Précédent</span>
  {% endif %}

  <div class="pagination-numbers">
    {% for p in page_numbers %}
      {% if p == "..." %}
        <span class="pagination-ellipsis">&hellip;</span>
      {% elif p == page %}
        <span class="pagination-link active">{{ p }}</span>
      {% else %}
        <a class="pagination-link" href="{{ base_url }}/{{ p }}">{{ p }}</a>
      {% endif %}
    {% endfor %}
  </div>

  {% if page < total_pages %}
    <a class="btn btn-outline transition-hover pagination-next" href="{{ base_url }}/{{ page + 1 }}">Suivant&nbsp;&#9658;</a>
  {% else %}
    <span class="btn btn-outline pagination-next disabled">Suivant&nbsp;&#9658;</span>
  {% endif %}
</nav>
