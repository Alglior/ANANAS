{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block meta_description %}{{ meta_description }}{% endblock %}

{% block content %}
<main>
  <section class="auth-section" id="inscription">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Créer un compte</h1>
        <p>Rejoignez A.N.A.N.A.S. pour publier et télécharger des géodonnées vérifiées.</p>
      </div>

      <form class="auth-form" id="inscriptionForm" action="/inscription" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required autocomplete="given-name" />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemple@domaine.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 caractères"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirmer le mot de passe</label>
          <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            placeholder="Retapez votre mot de passe"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="cgu" required />
            <span class="checkbox-label">J'accepte les conditions d'utilisation et la politique de confidentialité</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block transition-hover">S'inscrire</button>

        <p class="auth-footer">
          Déjà inscrit ? <a href="/connexion">Se connecter</a>
        </p>
      </form>
    </div>
  </section>
</main>
{% endblock %}
